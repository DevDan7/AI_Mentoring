<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="teacher.pageTitle">AI Mentoring - Painel do Professor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="css/theme.css">
    <style>
        .btn-history, .btn-set-exam, .btn-reset-exam { display: inline-block; width: auto !important; margin-bottom: 0 !important; margin-right: 0.25rem; }
        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
        .kpi-card { text-align: center; padding: 1rem; }
        .kpi-number { font-size: 2rem; font-weight: bold; }
        .kpi-label { font-size: 0.85rem; opacity: 0.7; }
    </style>
</head>
<body>
    <nav class="container">
        <ul>
            <li><strong>☁️ AI Mentoring Cloud</strong></li>
            <li><span data-i18n="teacher.role">Professor</span></li>
            <li id="langSwitcher"></li>
            <li><a href="#" id="logoutBtn" role="button" data-i18n="common.logout">Sair</a></li>
        </ul>
    </nav>

    <main class="container">
        <div id="errorMsg" style="display: none; color: var(--pico-color-red-500); margin-bottom: 1rem;"></div>

        <!-- KPIs Bar -->
        <section>
            <article>
                <header>
                    <h4 data-i18n="teacher.kpis">Indicadores</h4>
                </header>
                <div class="grid kpi-grid">
                    <div class="kpi-card">
                        <div class="kpi-number" id="kpiTotal">0</div>
                        <div class="kpi-label" data-i18n="teacher.kpiTotal">Total de Alunos</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-number" id="kpiInitial">0</div>
                        <div class="kpi-label" data-i18n="teacher.kpiInitial">Diagnóstico</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-number" id="kpiFreePractice">0</div>
                        <div class="kpi-label" data-i18n="teacher.kpiFree">Prática Livre</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-number" id="kpiFinalExam">0</div>
                        <div class="kpi-label" data-i18n="teacher.kpiFinal">Exame Final</div>
                    </div>
                </div>
            </article>
        </section>

        <!-- Secciones -->
        <section>
            <!-- Tabla de Alunos -->
            <section class="section active">
                <article>
                    <header>
                        <h4 data-i18n="teacher.students">Alunos</h4>
                        <div class="grid filtros">
                            <div>
                                <label data-i18n="teacher.cohort">Turma</label>
                                <select id="cohortFilter">
                                    <option value="" data-i18n="teacher.all">Todas</option>
                                </select>
                            </div>
                            <div>
                                <input type="text" id="searchInput" placeholder="Buscar nome ou e-mail" data-i18n-placeholder="teacher.search" />
                            </div>
                        </div>
                    </header>
                    <article>
                        <table>
                            <thead>
                                <tr>
                                    <th data-i18n="teacher.col.name">Nome</th>
                                    <th data-i18n="teacher.col.email">Email</th>
                                    <th data-i18n="teacher.col.cohort">Turma</th>
                                    <th data-i18n="teacher.col.phase">Fase Atual</th>
                                    <th data-i18n="teacher.col.finalExam">Exame Final</th>
                                    <th data-i18n="teacher.col.actions">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="studentTable">
                                <!-- Dinâmico -->
                            </tbody>
                        </table>
                    </article>
                </article>
            </section>

            <!-- Historial del Alumno (Req. 13.6: activado vía JS) -->
            <section id="historySection" class="section" style="display: none;">
                <article>
                    <header>
                        <h4 data-i18n="teacher.historyTitle">Histórico do Aluno</h4>
                        <button id="closeHistoryBtn" role="button" data-i18n="teacher.close">Fechar</button>
                    </header>
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th data-i18n="teacher.col.typeTopic">Tipo / Tema</th>
                                <th data-i18n="dash.col.status">Status</th>
                                <th data-i18n="dash.col.score">Score</th>
                                <th data-i18n="dash.col.date">Data</th>
                                <th data-i18n="teacher.col.details">Detalhes</th>
                            </tr>
                        </thead>
                        <tbody id="historyTable">
                            <!-- Dinâmico -->
                        </tbody>
                    </table>
                </article>
            </section>
        </section>

        <!-- Sección de Turmas -->
        <section class="section" style="display: none;">
            <article>
                <header>
                    <h4 data-i18n="teacher.cohortsTitle">Turmas</h4>
                </header>
                <article>
                    <table>
                        <thead>
                            <tr>
                                <th data-i18n="teacher.col.cohort">Turma</th>
                                <th data-i18n="teacher.col.cohortName">Nome</th>
                                <th data-i18n="teacher.col.students">Alunos</th>
                                <th data-i18n="teacher.col.max">Máximo</th>
                                <th>%</th>
                            </tr>
                        </thead>
                        <tbody id="cohortsTable">
                            <!-- Dinâmico -->
                        </tbody>
                    </table>
                </article>
            </article>
        </section>
    </main>

    <script src="js/i18n.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/teacher.js"></script>
</body>
</html>
