<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mentoring - Painel do Professor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <style>
        .btn-history, .btn-set-exam, .btn-reset-exam { display: inline-block; width: auto !important; margin-bottom: 0 !important; margin-right: 0.25rem; }
        .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
        .kpi-card { text-align: center; padding: 1rem; }
        .kpi-number { font-size: 2rem; font-weight: bold; }
        .kpi-label { font-size: 0.85rem; opacity: 0.7; }
    </style>
</head>
<body>
    <nav class="container">
        <ul>
            <li><strong>☁️ AI Mentoring Cloud</strong></li>
            <li><span id="teacherName">Professor</span></li>
            <li><a href="#" id="logoutBtn" role="button">Sair</a></li>
        </ul>
    </nav>

    <main class="container">
        <div id="errorMsg" style="display: none; color: var(--pico-color-red-500); margin-bottom: 1rem;"></div>
        <div id="successMsg" style="display: none; color: var(--pico-color-green-500); margin-bottom: 1rem;"></div>

        <!-- KPIs Bar -->
        <section id="kpiSection">
            <article>
                <header>
                    <h4>Indicadores</h4>
                </header>
                <div class="grid kpi-grid">
                    <div class="kpi-card">
                        <div class="kpi-number" id="kpiTotal">0</div>
                        <div class="kpi-label">Total de Alunos</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-number" id="kpiInitial">0</div>
                        <div class="kpi-label">Diagnóstico</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-number" id="kpiFreePractice">0</div>
                        <div class="kpi-label">Prática Livre</div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-number" id="kpiFinalExam">0</div>
                        <div class="kpi-label">Exame Final</div>
                    </div>
                </div>
            </article>
        </section>

        <!-- Secciones -->
        <section id="sections">
            <!-- Tabla de Alunos -->
            <section id="studentsSection" class="section active">
                <article>
                    <header>
                        <h4>Alunos</h4>
                        <div class="grid filtros">
                            <div>
                                <label>Turma</label>
                                <select id="cohortFilter">
                                    <option value="">Todas</option>
                                </select>
                            </div>
                            <div>
                                <input type="text" id="searchInput" placeholder="Buscar nome ou e-mail" />
                            </div>
                        </div>
                    </header>
                    <article>
                        <table>
                            <thead>
                                <tr>
                                    <th>Nome</th>
                                    <th>Email</th>
                                    <th>Turma</th>
                                    <th>Fase Atual</th>
                                    <th>Exame Final</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="studentTable">
                                <!-- Dinâmico -->
                            </tbody>
                        </table>
                    </article>
                </article>
            </section>

            <!-- Historial del Alumno (Req. 13.6: activado vía JS) -->
            <section id="historySection" class="section" style="display: none;">
                <article>
                    <header>
                        <h4 id="historyTitle">Histórico do Aluno</h4>
                        <button id="closeHistoryBtn" role="button">Fechar</button>
                    </header>
                    <table>
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Tipo / Tema</th>
                                <th>Status</th>
                                <th>Score</th>
                                <th>Data</th>
                            </tr>
                        </thead>
                        <tbody id="historyTable">
                            <!-- Dinâmico -->
                        </tbody>
                    </table>
                </article>
            </section>
        </section>

        <!-- Sección de Turmas -->
        <section id="cohortsSection" class="section" style="display: none;">
            <article>
                <header>
                    <h4>Turmas</h4>
                </header>
                <article>
                    <table>
                        <thead>
                            <tr>
                                <th>Turma</th>
                                <th>Nome</th>
                                <th>Alunos</th>
                                <th>Máximo</th>
                                <th>%</th>
                            </tr>
                        </thead>
                        <tbody id="cohortsTable">
                            <!-- Dinâmico -->
                        </tbody>
                    </table>
                </article>
            </article>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/teacher.js"></script>
</body>
</html>
