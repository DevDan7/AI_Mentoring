<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mentoring - Painel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
    <nav class="container">
        <ul>
            <li><strong>☁️ AI Mentoring Cloud</strong></li>
        </ul>
        <ul>
            <li><span id="userName">Carregando perfil...</span></li>
            <li><a href="#" role="button" class="secondary" onclick="logout()">Sair</a></li>
        </ul>
    </nav>

    <main class="container">
        <section id="profileSection">
            <article>
                <header>
                    <h4>Perfil do Aluno</h4>
                </header>
                <div class="grid">
                    <div><strong>E-mail:</strong> <span id="userEmail">-</span></div>
                    <div><strong>Turma:</strong> <span id="userCohort">-</span></div>
                    <div><strong>ID do Estudante:</strong> <span id="studentId">-</span></div>
                </div>
            </article>
        </section>

        <section id="quizSection">
            <article>
                <header>
                    <h4>Gerar Novo Simulado</h4>
                </header>
                <form id="quizForm">
                    <label for="topicSelect">
                        Tema de Certificação AWS
                        <select id="topicSelect" required>
                            <option value="Cloud Concepts & Well-Architected">Cloud Concepts & Well-Architected</option>
                            <option value="Security, Identity & Compliance">Security, Identity & Compliance</option>
                            <option value="Compute & Containers">Compute & Containers</option>
                            <option value="Storage & Database">Storage & Database</option>
                            <option value="Networking & Content Delivery">Networking & Content Delivery</option>
                            <option value="Data, Analytics & Machine Learning">Data, Analytics & Machine Learning</option>
                            <option value="Management, Governance & DevOps">Management, Governance & DevOps</option>
                            <option value="Billing, Cost Management & Support">Billing, Cost Management & Support</option>
                            <option value="Application Integration & Serverless Architecture">Application Integration & Serverless Architecture</option>
                            <option value="General / Otros Servicios">General / Outros Serviços</option>
                        </select>
                    </label>

                    <label for="questionCount">
                        Quantidade de Perguntas
                        <input type="number" id="questionCount" min="1" max="10" value="3" required>
                    </label>

                    <button type="submit" id="generateBtn">Iniciar Simulado</button>
                </form>
            </article>
        </section>
    </main>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script>
        checkAuth();

        async function loadProfile() {
            try {
                const data = await ensureStudentProfile();
                document.getElementById("userName").innerText = data.Name || "Aluno";
                document.getElementById("userEmail").innerText = data.Email;
                document.getElementById("userCohort").innerText = data.CohortID || data.Cohort || "Sem turma";
                document.getElementById("studentId").innerText = data.StudentID;
            } catch (err) {
                console.error(err);
                document.getElementById("userName").innerText = "Erro ao carregar perfil";
            }
        }

        document.getElementById("quizForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const topic = document.getElementById("topicSelect").value;
            const count = parseInt(document.getElementById("questionCount").value);
            const btn = document.getElementById("generateBtn");

            btn.ariaBusy = "true";
            btn.disabled = true;

            try {
                const quizData = await generateQuiz(topic, count);
                localStorage.setItem("active_quiz", JSON.stringify(quizData));
                window.location.href = "quiz.html";
            } catch (err) {
                alert(err.message);
            } finally {
                btn.ariaBusy = "false";
                btn.disabled = false;
            }
        });

        loadProfile();
    </script>
</body>
</html>
