<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mentoring - Resultados</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>
    <nav class="container">
        <ul>
            <li><strong>☁️ AI Mentoring Cloud</strong></li>
        </ul>
        <ul>
            <li><a href="dashboard.html" role="button" class="secondary outline">Volver al Dashboard</a></li>
        </ul>
    </nav>

    <main class="container">
        <div id="loadingState" class="center" style="margin-top: 3rem;">
            <progress></progress>
            <p>Cargando resultados...</p>
        </div>

        <div id="errorState" style="display: none;">
            <article>
                <header><h4 style="color: var(--pico-color-red-500);">Error</h4></header>
                <p id="errorMessage">No se pudieron cargar los resultados.</p>
                <a href="dashboard.html" role="button">Volver al Dashboard</a>
            </article>
        </div>

        <div id="resultsState" style="display: none;">
            <article>
                <header>
                    <h3 style="text-align: center;">Resumen del Simulado</h3>
                </header>
                
                <div class="grid" style="text-align: center; margin-bottom: 2rem;">
                    <div>
                        <h2 id="scorePercentage" style="margin-bottom: 0;">0%</h2>
                        <small>Puntaje Final</small>
                    </div>
                    <div>
                        <h2 id="correctCount" style="margin-bottom: 0; color: var(--pico-color-green-500);">0</h2>
                        <small>Correctas</small>
                    </div>
                    <div>
                        <h2 id="totalCount" style="margin-bottom: 0;">0</h2>
                        <small>Total Preguntas</small>
                    </div>
                </div>

                <h4>Desglose de Respuestas</h4>
                <div id="answersContainer"></div>

                <div style="margin-top: 2rem; text-align: center;">
                    <a href="dashboard.html" role="button">Realizar Otro Simulado</a>
                </div>
            </article>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script>
        const token = checkAuth();

        async function loadResults() {
            // Extract quizId from URL params OR localStorage fallback
            const urlParams = new URLSearchParams(window.location.search);
            const quizId = urlParams.get('quizId') || localStorage.getItem('last_quiz_id');

            if (!quizId) {
                showError("No se encontró un ID de simulado válido.");
                return;
            }

            try {
                // Invocación a la API real
                const response = await fetch(`${CONFIG.apiUrl}/quizzes/${quizId}/results`, {
                    headers: { 
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    }
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    throw new Error(errData.error || `Error HTTP ${response.status}`);
                }

                const data = await response.json();

                // 1. Mostrar Métricas
                const metrics = data.metrics || {};
                document.getElementById("scorePercentage").textContent = `${metrics.score_percentage || 0}%`;
                document.getElementById("correctCount").textContent = metrics.correct_answers || 0;
                document.getElementById("totalCount").textContent = metrics.total_questions || 0;

                // 2. Renderizar Respuestas
                const answersList = data.answers || [];
                const container = document.getElementById("answersContainer");
                container.innerHTML = "";

                if (answersList.length === 0) {
                    container.innerHTML = "<p>No hay respuestas registradas para este simulado.</p>";
                } else {
                    answersList.forEach((item, index) => {
                        const card = document.createElement("article");
                        const isCorrect = Boolean(item.is_correct || item.IsCorrect);
                        
                        card.style.borderLeft = `6px solid ${isCorrect ? 'var(--pico-color-green-500)' : 'var(--pico-color-red-500)'}`;
                        card.style.marginBottom = "1rem";
                        
                        card.innerHTML = `
                            <header style="padding: 0.5rem 1rem;">
                                <strong>Pregunta ${index + 1}</strong> — 
                                <span style="color: ${isCorrect ? 'var(--pico-color-green-600)' : 'var(--pico-color-red-600)'}; font-weight: bold;">
                                    ${isCorrect ? 'Correcta ✅' : 'Incorrecta ❌'}
                                </span>
                            </header>
                            <div style="padding: 0.5rem 1rem;">
                                <p style="margin-bottom: 0.25rem;"><strong>Respuesta enviada:</strong> ${(item.given_answers || []).join(', ') || '-'}</p>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                }

                document.getElementById("loadingState").style.display = "none";
                document.getElementById("resultsState").style.display = "";

            } catch (err) {
                showError(err.message);
            }
        }

        function showError(msg) {
            document.getElementById("loadingState").style.display = "none";
            document.getElementById("errorMessage").textContent = msg;
            document.getElementById("errorState").style.display = "";
        }

        loadResults();
    </script>
</body>
</html>
